<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pizza Visualization</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    #container { margin: 20px auto; display: flex; justify-content: center; }
    .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
        margin: 0 5px;
        font-size: 1.8rem; /* For emojis */
        transition: transform 0.1s ease-in-out;
    }
    .icon-btn:hover {
        transform: scale(1.15);
    }
    .icon-btn img { height: 35px; }
  </style>
</head>
<body class="text-center">
  <div class="container">
    <h1 class="display-4">D3.js Visualization</h1>
    <h2 class="text-muted">By Sarah Meyer</h2>
    <div id="container">
    </div>
    <div id="controls" class="mb-4">
      <div class="row justify-content-center">
        <div class="col-md-3">
          <h5 class="mb-3">Base</h5>
          <div class="d-flex justify-content-center align-items-center">
            <button id="btn-sauce" class="icon-btn" title="Add Sauce">🥫</button>
            <button id="btn-cheese" class="icon-btn" title="Add Cheese">🧀</button>
          </div>
        </div>
        <div class="col-md-3">
          <h5 class="mb-3">Toppings</h5>
          <div class="d-flex justify-content-center align-items-center">
            <button id="btn-pepperoni" class="icon-btn" title="Add Pepperoni">🔴</button>
            <button id="btn-mushrooms" class="icon-btn" title="Add Mushrooms"><img src="mushroom_clipart.png" alt="Mushroom icon"></button>
            <button id="btn-red-peppers" class="icon-btn" title="Add Red Peppers"><img src="red_pepper_clipart.png" alt="Red pepper icon"></button>
            <button id="btn-broccoli" class="icon-btn" title="Add Broccoli"><img src="broccoli_clipart.png" alt="Broccoli icon"></button>
          </div>
        </div>
        <div class="col-md-3">
          <h5 class="mb-3">Finish</h5>
          <div class="d-flex justify-content-center align-items-center">
            <button id="btn-flakes" class="icon-btn" title="Add Pepper Flakes">🌶️</button>
            <button id="btn-herbs" class="icon-btn" title="Add Herbs">🌿</button>
            <button id="btn-cook" class="icon-btn" title="Cook Pizza">🍳</button>
            <button id="btn-clear" class="icon-btn" title="Clear Pizza">🗑️</button>
          </div>
        </div>
      </div>
    </div>
    <div id="stats-screen" class="d-none">
      <h2 class="mb-4">Pizza Stats</h2>
      <div class="row">
        <div class="col-md-6">
          <h4>Nutritional Value</h4>
          <ul id="nutrition-list" class="list-group text-start"></ul>
        </div>
        <div class="col-md-6">
          <h4>Topping Distribution</h4>
          <div id="chart-container"></div>
        </div>
      </div>
      <button id="btn-play-again" class="btn btn-primary btn-lg mt-4">Play Again</button>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module">

  const width = 800;
  const height = 600;

  //SVG Container
  const svg = d3.select("#container")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

  // Pizza dimensions
  const cx = width / 2;
  const cy = 2 * height / 3;
  const rx = 280;
  const ry = 130;

  // Centralized configuration for topping amounts
  const toppingAmounts = {
    cheese: 200,
    pepperoni: 10,
    mushrooms: 15,
    redPeppers: 15,
    broccoli: 15,
    flakes: 10,
    herbs: 10
  };

  // ===== FUNCTION DEFINITIONS =====

  function getInitialPizzaStats() {
    return { sauce: 0, cheese: 0, pepperoni: 0, mushrooms: 0, flakes: 0, herbs: 0, redPeppers: 0, broccoli: 0 };
  }

  function drawBackground() {
    const squareSize = width / 20;
    const cols = width / squareSize;
    const rows = height / squareSize;

    const data = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        data.push({ row, col, x: col * squareSize, y: row * squareSize });
      }
    }

    svg.selectAll("rect.checkerboard")
      .data(data)
      .enter()
      .append("rect")
      .attr("class", "checkerboard")
      .attr("x", d => d.x)
      .attr("y", d => d.y)
      .attr("width", squareSize)
      .attr("height", squareSize)
      .attr("fill", d => (d.row + d.col) % 2 === 0 ? "white" : "red");
  }

  function drawPizzaCrust() {
    svg.append("ellipse")
      .attr("cx", cx)
      .attr("cy", cy)
      .attr("rx", 300)
      .attr("ry", 150)
      .attr("fill", "#DEB887")
      .attr("stroke", "#dba763")
      .attr("stroke-width", 20);
  }

  function drawSauce() {
    const waves = 12;
    const waveHeight = 7;
    
    let pathData = "M";
    for (let i = 0; i <= 360; i += 1) {
      const angle = (i * Math.PI) / 180;
      const wave = waveHeight * Math.sin((i / 360) * waves * Math.PI * 2);
      const x = cx + (rx + wave) * Math.cos(angle);
      const y = cy + (ry + wave * 0.5) * Math.sin(angle);
      pathData += `${i === 0 ? "" : "L"} ${x} ${y}`;
    }
    pathData += " Z";

    svg.append("path")
      .attr("d", pathData)
      .attr("fill", "#ba1a1a");
    pizzaStats.sauce = 1;
  }

  function addCheese(numLines) {
    const cheeseColors = ["#FFD700", "#FFA500", "#FFE4B5", "#FFDAB9", "#FFFACD"];
    const data = d3.range(numLines).map(() => {
      const angle1 = Math.random() * Math.PI * 2;
      const dist1 = Math.sqrt(Math.random()) * rx;
      const x1 = cx + dist1 * Math.cos(angle1);
      const y1 = cy + (dist1 * ry / rx) * Math.sin(angle1);
      const lineAngle = Math.random() * Math.PI * 2;
      const lineLength = Math.random() * 20 + 5;
      return { x1, y1, x2: x1 + lineLength * Math.cos(lineAngle), y2: y1 + lineLength * Math.sin(lineAngle) };
    });

    svg.selectAll(null) // Use a non-matching selector to ensure .enter() is always populated
      .data(data)
      .enter()
      .append("line")
      .attr("class", "cheese-strand")
      .attr("x1", d => d.x1)
      .attr("y1", d => d.y1)
      .attr("x2", d => d.x2)
      .attr("y2", d => d.y2)
      .attr("stroke", () => cheeseColors[Math.floor(Math.random() * cheeseColors.length)])
      .attr("stroke-width", () => Math.random() * 2 + 1)
      .attr("opacity", () => Math.random() * 0.6 + 0.3);

    pizzaStats.cheese += numLines;
  }

  function drawPepperoni(count) {
    const pepperoniColors = ["#E63946", "#C1121F", "#D62828", "#D32F2F"];
    const data = d3.range(count).map(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.sqrt(Math.random()) * (rx - 25);
      return {
        x: cx + dist * Math.cos(angle),
        y: cy + (dist * ry / rx) * Math.sin(angle),
        color: pepperoniColors[Math.floor(Math.random() * pepperoniColors.length)]
      };
    });

    svg.selectAll(null) // Use a non-matching selector to ensure .enter() is always populated
      .data(data)
      .enter()
      .append("ellipse")
      .attr("class", "pepperoni")
      .attr("cx", d => d.x)
      .attr("cy", d => d.y)
      .attr("rx", 20)
      .attr("ry", 13)
      .attr("fill", d => d.color);

    pizzaStats.pepperoni += count;
  }

  function drawPolygonTopping(count, toppingName, points, color, opacity) {
    const data = d3.range(count).map(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.sqrt(Math.random()) * (rx - 20);
      return {
        x: cx + dist * Math.cos(angle),
        y: cy + (dist * ry / rx) * Math.sin(angle),
        rotation: Math.random() * 360
      };
    });

    svg.selectAll(null) // Use a non-matching selector to ensure .enter() is always populated
      .data(data)
      .enter()
      .append("polygon")
      .attr("class", `topping-${toppingName}`)
      .attr("points", points)
      .attr("fill", color)
      .attr("transform", d => `translate(${d.x}, ${d.y}) rotate(${d.rotation})`)
      .attr("opacity", opacity);

    pizzaStats[toppingName] += count;
  }

  function drawImageTopping(count, toppingName, imageUrl, options = {}) {
    const {
        baseSize = 30,
        sizeVariance = 20,
        sizeMultiplier = 1,
        ellipseMargin = 40
    } = options;

    const data = d3.range(count).map(() => {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.sqrt(Math.random()) * (rx - ellipseMargin);
      return {
        x: cx + dist * Math.cos(angle),
        y: cy + (dist * ry / rx) * Math.sin(angle),
        size: Math.random() * sizeVariance + baseSize,
        rotation: Math.random() * 360
      };
    });

    svg.selectAll(null) // Use a non-matching selector to ensure .enter() is always populated
      .data(data)
      .enter()
      .append("image")
      .attr("class", `topping-${toppingName}`)
      .attr("href", imageUrl)
      .attr("x", d => -d.size / 2)
      .attr("y", d => -d.size / 2)
      .attr("width", d => d.size * sizeMultiplier)
      .attr("height", d => d.size * sizeMultiplier)
      .attr("transform", d => `translate(${d.x}, ${d.y}) scale(1, ${ry / rx}) rotate(${d.rotation})`);

    pizzaStats[toppingName] += count;
  }

  let pizzaStats = getInitialPizzaStats();

  const nutritionData = {
    base:       { cal: 250, pro: 12, fat: 10, carb: 25 },
    sauce:      { cal: 50,  pro: 1,  fat: 0,  carb: 10 }, // per serving (1)
    cheese:     { cal: 0.2, pro: 0.02, fat: 0.03, carb: 0.01 }, // per strand
    pepperoni:  { cal: 15,  pro: 1,  fat: 1.3, carb: 0.1 }, // per slice
    mushrooms:  { cal: 5,   pro: 0.5, fat: 0,  carb: 1 }, // per piece
    redPeppers: { cal: 5,   pro: 0.2, fat: 0,  carb: 1.5 }, // per piece
    broccoli:   { cal: 5,   pro: 0.4, fat: 0,  carb: 1 }, // per piece
    flakes:     { cal: 0.5, pro: 0,  fat: 0,  carb: 0.1 }, // per dash
    herbs:      { cal: 0.5, pro: 0,  fat: 0,  carb: 0.1 }  // per dash
  };

  function cookPizza() {
    // Hide game
    d3.select("#container").classed("d-none", true);
    d3.select("#controls").classed("d-none", true);
    d3.select("#stats-screen").classed("d-none", false);

    // Calculate Nutrition from pizzaStats
    let totalCal = nutritionData.base.cal;
    let totalPro = nutritionData.base.pro;
    let totalFat = nutritionData.base.fat;
    let totalCarb = nutritionData.base.carb;

    for (const topping in pizzaStats) {
        if (pizzaStats[topping] > 0 && nutritionData[topping]) {
            totalCal += pizzaStats[topping] * nutritionData[topping].cal;
            totalPro += pizzaStats[topping] * nutritionData[topping].pro;
            totalFat += pizzaStats[topping] * nutritionData[topping].fat;
            totalCarb += pizzaStats[topping] * nutritionData[topping].carb;
        }
    }
    
    const nutritionHTML = `
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Calories
        <span class="badge bg-primary rounded-pill">${Math.round(totalCal)}</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Protein
        <span class="badge bg-primary rounded-pill">${Math.round(totalPro)}g</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Fat
        <span class="badge bg-primary rounded-pill">${Math.round(totalFat)}g</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Carbohydrates
        <span class="badge bg-primary rounded-pill">${Math.round(totalCarb)}g</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Topping Count
        <span class="badge bg-secondary rounded-pill">${pizzaStats.pepperoni + pizzaStats.mushrooms + pizzaStats.redPeppers + pizzaStats.broccoli}</span>
      </li>
    `;
    d3.select("#nutrition-list").html(nutritionHTML);

    // Draw Chart
    const chartData = [
      { name: "Pepperoni", value: pizzaStats.pepperoni },
      { name: "Mushrooms", value: pizzaStats.mushrooms },
      { name: "Red Peppers", value: pizzaStats.redPeppers },
      { name: "Broccoli", value: pizzaStats.broccoli }
    ].filter(d => d.value > 0);

    const chartWidth = 400;
    const chartHeight = 300;
    const margin = {top: 20, right: 20, bottom: 40, left: 40};

    d3.select("#chart-container").selectAll("*").remove();
    
    if (chartData.length === 0) {
        d3.select("#chart-container").append("p").text("No toppings added!");
        return;
    }

    const svgChart = d3.select("#chart-container")
      .append("svg")
      .attr("width", chartWidth)
      .attr("height", chartHeight);

    const x = d3.scaleBand()
      .range([margin.left, chartWidth - margin.right])
      .padding(0.1)
      .domain(chartData.map(d => d.name));

    const y = d3.scaleLinear()
      .range([chartHeight - margin.bottom, margin.top])
      .domain([0, d3.max(chartData, d => d.value)]);

    svgChart.append("g")
      .attr("transform", `translate(0,${chartHeight - margin.bottom})`)
      .call(d3.axisBottom(x));

    svgChart.append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y));

    svgChart.selectAll(".bar")
      .data(chartData)
      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.name))
      .attr("y", d => y(d.value))
      .attr("width", x.bandwidth())
      .attr("height", d => y(0) - y(d.value))
      .attr("fill", "steelblue");
  }

  function resetGame() {
    svg.selectAll("*").remove();
    drawBackground();
    drawPizzaCrust();
    pizzaStats = getInitialPizzaStats();
    d3.select("#stats-screen").classed("d-none", true);
    d3.select("#container").classed("d-none", false);
    d3.select("#controls").classed("d-none", false);
  }

  function throttle(func, limit) {
    let inThrottle;
    return function() {
      const btn = d3.select(this);
      if (!inThrottle) {
        func.apply(this, arguments);
        inThrottle = true;
        btn.attr("disabled", true);
        setTimeout(() => {
          inThrottle = false;
          btn.attr("disabled", null);
        }, limit);
      }
    }
  }
  
  
  // ===== MAIN EXECUTION =====

  drawBackground();
  drawPizzaCrust();

  // Button Event Listeners
  d3.select("#btn-sauce").on("click", throttle(() => drawSauce(), 500));
  d3.select("#btn-cheese").on("click", throttle(() => addCheese(toppingAmounts.cheese), 500));
  d3.select("#btn-pepperoni").on("click", throttle(() => drawPepperoni(toppingAmounts.pepperoni), 500));
  d3.select("#btn-flakes").on("click", throttle(() => {
    const size = Math.random() * 4 + 2;
    drawPolygonTopping(toppingAmounts.flakes, 'flakes', `0,${-size} ${size},${size/2} ${-size},${size/2}`, '#FF4500', 0.8);
  }, 500));
  d3.select("#btn-herbs").on("click", throttle(() => {
    const size = Math.random() * 4 + 2;
    drawPolygonTopping(toppingAmounts.herbs, 'herbs', `0,${-size} ${size/1.5},0 0,${size} ${-size/1.5},0`, '#3D7D00', 0.7);
  }, 500));
  d3.select("#btn-mushrooms").on("click", throttle(() => drawImageTopping(toppingAmounts.mushrooms, 'mushrooms', 'mushroom_clipart.png'), 500));
  d3.select("#btn-red-peppers").on("click", throttle(() => drawImageTopping(toppingAmounts.redPeppers, 'redPeppers', 'red_pepper_clipart.png', { sizeMultiplier: 3, ellipseMargin: 50 }), 500));
  d3.select("#btn-broccoli").on("click", throttle(() => drawImageTopping(toppingAmounts.broccoli, 'broccoli', 'broccoli_clipart.png', { sizeMultiplier: 2, ellipseMargin: 50 }), 500));
  d3.select("#btn-cook").on("click", cookPizza);
  d3.select("#btn-play-again").on("click", resetGame);
  d3.select("#btn-clear").on("click", resetGame);
</script>
</body>
</html>
